      if (a.membershipId) label += ' · ' + mName(a.membershipId);
      const isDebit = a.normal === 'DEBIT';
      return `<tr>
        <td class="text-sm">${esc(label)}</td>
        <td class="text-right mono">${isDebit && a.balance ? money(a.balance) : '—'}</td>
        <td class="text-right mono">${!isDebit && a.balance ? money(a.balance) : '—'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="3" class="empty">No accounts with balance</td></tr>`;

  const memberRows = MemberService.list().map(m => {
    const sav = Ledger.balance(`SAV-${m.id}`);
    const shr = Ledger.balance(`SHR-${m.id}`);
    const loan = Ledger.balance(`LOAN-${m.id}`);
    return `<tr>
      <td class="text-sm">${esc(m.name)}</td>
      <td class="text-right mono">${money(sav)}</td>
      <td class="text-right mono text-[#c9a227]">${money(shr)}</td>
      <td class="text-right mono ${loan > 0 ? 'text-rose-700 font-semibold' : 'text-slate-400'}">${money(loan)}</td>
      <td class="text-right mono font-semibold">${money(sav + shr - loan)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">No members yet</td></tr>`;

  const unitRows = UnitService.list().map(u => {
    const cap = Ledger.balance(`UNIT-${u.id}`);
    return `<tr>
      <td class="text-sm font-medium">${esc(u.name)}</td>
      <td class="text-xs text-slate-400">${esc(u.code)}</td>
      <td class="text-sm">${u.managerId ? esc(mName(u.managerId)) : '—'}</td>
      <td>${pill(u.status)}</td>
      <td class="text-right mono font-semibold text-[#c9a227]">${money(cap)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">No business units yet</td></tr>`;

  return `
  ${header('Reports', 'Trial balance, member position, and business unit performance.')}

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${kpi('Total Assets', money(cash + loans), 'Cash + loans')}
    ${kpi('Total Liabilities', money(savings + support), 'Savings + funds')}
    ${kpi('Total Equity', money(equity + shares + units), 'Capital + shares + units', 'text-[#c9a227]')}
    ${kpi('Interest Income', money(interest), 'Earned', 'text-emerald-700')}
  </div>

  <div class="card p-5 mb-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-slate-800">Trial balance</h2>
      <button class="btn btn-s btn-xs" onclick="window.print()">🖨 Print</button>
    </div>
    <div class="overflow-x-auto">
      <table>
        <thead><tr><th>Account</th><th class="text-right">Debit</th><th class="text-right">Credit</th></tr></thead>
        <tbody>${tbRows}</tbody>
        <tfoot>
          <tr class="border-t-2 border-[#e5ebe9] bg-[#f9fbfb]">
            <td class="font-extrabold text-[#0b3d36]">TOTAL</td>
            <td class="text-right mono font-extrabold text-[#0b3d36]">${money(verify.debit)}</td>
            <td class="text-right mono font-extrabold text-[#0b3d36]">${money(verify.credit)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="text-[11px] mt-3 font-semibold ${verify.balanced ? 'text-emerald-600' : 'text-rose-600'}">
      ${verify.balanced ? '✓ Ledger balanced.' : '⚠ Out of balance.'}
    </p>
  </div>

  <div class="grid lg:grid-cols-2 gap-4">
    <div class="card p-5">
      <h2 class="font-bold text-slate-800 mb-3">Member position</h2>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Member</th><th class="text-right">Savings</th><th class="text-right">Shares</th><th class="text-right">Loan</th><th class="text-right">Net</th></tr></thead>
          <tbody>${memberRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card p-5">
      <h2 class="font-bold text-slate-800 mb-3">Business units</h2>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Unit</th><th>Code</th><th>Manager</th><th>Status</th><th class="text-right">Capital</th></tr></thead>
          <tbody>${unitRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
};

/* ----- SETTINGS ----- */
views.settings = () => {
  const verify = Ledger.verify();
  return `
  ${header('Settings', 'Organization configuration and data management.')}

  <div class="grid lg:grid-cols-2 gap-4">
    <div class="card p-5">
      <h2 class="font-bold text-slate-800 mb-4">Organization</h2>
      <form onsubmit="event.preventDefault(); submitSettings(this);">
        <label class="text-xs font-semibold text-slate-600">Name</label>
        <input name="name" class="inp mb-3" value="${esc(state.org.name)}" required>

        <label class="text-xs font-semibold text-slate-600">Legal name</label>
        <input name="legalName" class="inp mb-3" value="${esc(state.org.legalName || '')}" placeholder="e.g. Ziyarah Digital Business Group Ltd">

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="text-xs font-semibold text-slate-600">Currency</label>
            <input name="currency" class="inp" value="${esc(state.org.currency)}">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Symbol</label>
            <input name="symbol" class="inp" value="${esc(state.org.symbol)}">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="text-xs font-semibold text-slate-600">Share price</label>
            <input name="sharePrice" type="number" step="0.01" class="inp" value="${state.org.sharePrice}">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Founded</label>
            <input name="founded" type="date" class="inp" value="${state.org.founded || ''}">
          </div>
        </div>

        <button class="btn btn-p w-full" type="submit">Save settings</button>
      </form>
    </div>

    <div class="space-y-4">
      <div class="card p-5">
        <h2 class="font-bold text-slate-800 mb-1">Demo data</h2>
        <p class="text-xs text-slate-500 mb-3">Load or reload the sample dataset to explore the platform.</p>
        <button class="btn btn-s w-full" onclick="loadDemoConfirm()">▶ Load demo data</button>
      </div>

      <div class="card p-5">
        <h2 class="font-bold text-slate-800 mb-4">Data management</h2>
        <button class="btn btn-p w-full mb-2" onclick="DB.export()">⬇ Export backup (JSON)</button>
        <label class="btn btn-s w-full cursor-pointer mb-2">
          ⬆ Import backup
          <input type="file" accept="application/json" class="hidden" onchange="handleImport(event)">
        </label>
        <button class="btn btn-r w-full" onclick="confirmReset()">Reset to empty state</button>
      </div>

      <div class="card p-5">
        <h2 class="font-bold text-slate-800 mb-4">System status</h2>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-slate-500">Ledger</span>
            <span class="font-semibold ${verify.balanced ? 'text-emerald-700' : 'text-rose-700'}">${verify.balanced ? '✓ Balanced' : '⚠ Broken'}</span>
          </div>
          <div class="flex justify-between"><span class="text-slate-500">Schema version</span><span class="font-semibold">v${state.schemaVersion}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Storage</span><span class="font-semibold">${DB.sizeKB()} KB</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Total records</span><span class="font-semibold">${DB.count()}</span></div>
        </div>
      </div>
    </div>
  </div>`;
};

function submitSettings(form){
  guard(() => {
    Object.assign(state.org, {
      name: form.name.value, legalName: form.legalName.value,
      currency: form.currency.value.toUpperCase(), symbol: form.symbol.value,
      sharePrice: round(num(form.sharePrice.value)) || 100,
      founded: form.founded.value,
    });
    DB.save();
    toast('Settings saved');
    safeRender();
  })();
}

async function handleImport(event){
  const f = event.target.files[0];
  if (!f) return;
  try {
    await DB.import(f);
    state = DB.load();
    currentUser = state.members.find(m => m.role === 'ADMIN') || state.members[0] || null;
    toast('Backup imported');
    safeRender();
  } catch (e) { toast('Import failed: ' + e.message, 'err'); }
}

function confirmReset(){
  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Reset to empty state?</h2>
    <p class="text-sm text-slate-600 mb-4">Deletes all members, units, campaigns, loans and journal entries. Chart of accounts is re-created.</p>
    <p class="text-xs text-slate-500 mb-4">Back up first if you need to keep any data.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-r" onclick="doReset()">Yes, reset</button>
    </div>
  `);
}

function doReset(){
  DB.clear();
  seed();
  currentUser = null;
  closeModal();
  toast('Platform reset to empty state');
  go('dashboard');
  safeRender();
}

function loadDemoConfirm(){
  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">Load demo data?</h2>
    <p class="text-sm text-slate-600 mb-4">This replaces all current data with the sample dataset (5 members, 3 units, 2 campaigns, 1 loan).</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="doLoadDemo()">Load demo</button>
    </div>
  `);
}

function doLoadDemo(){
  DB.clear();
  seedDemo();
  currentUser = state.members.find(m => m.role === 'ADMIN') || state.members[0] || null;
  closeModal();
  toast('Demo data loaded');
  go('dashboard');
  safeRender();
}

/* ============================================================
   NAV + RENDER
   ============================================================ */
function buildNav(){
  const nav = document.getElementById('navMenu');
  nav.innerHTML = CONFIG.nav.map(item => {
    if (item.section) return `<div class="px-4 text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-4 mb-1">${item.section}</div>`;
    return `<a class="nav-link" data-route="${item.route}" onclick="go('${item.route}'); return false;">
      <span class="nav-icon">${item.icon}</span><span>${item.label}</span>
    </a>`;
  }).join('');
}

function render(){
  const { route } = parseRoute();
  const titles = {
    dashboard: 'Dashboard', members: 'Members', units: 'Business Units',
    savings: 'Savings', loans: 'Loans', support: 'Support Funds',
    shares: 'Shares & Equity', ledger: 'General Ledger',
    reports: 'Reports', settings: 'Settings',
  };

  document.getElementById('pageTitle').textContent = titles[route] || 'Dashboard';
  document.getElementById('breadcrumb').textContent = 'Home / ' + (titles[route] || 'Dashboard');
  document.getElementById('sideCurrency').textContent = state.org.currency;
  document.getElementById('userName').textContent = currentUser?.name || 'Not signed in';
  document.getElementById('userRole').textContent = currentUser ? (CONFIG.roles[currentUser.role] || 'Member') : 'Add a member to start';
  document.getElementById('userAvatar').textContent = currentUser ? initials(currentUser.name) : '?';

  document.querySelectorAll('[data-route]').forEach(el => {
    el.classList.toggle('active', el.dataset.route === route);
  });

  const html = views[route] ? views[route]() : `<div class="card p-10 text-center text-slate-400">Page not found</div>`;
  document.getElementById('view').innerHTML = html;
  updateStats();
}

function safeRender(){
  try { render(); }
  catch (e) {
    console.error('Render failed:', e);
    document.getElementById('view').innerHTML = `
      <div class="card p-6 border-l-4 border-l-rose-500">
        <div class="font-bold text-rose-700 mb-2">Something went wrong</div>
        <div class="text-sm text-slate-600 mb-2 mono">${esc(e.message)}</div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-s" onclick="safeRender()">Retry</button>
          <button class="btn btn-r" onclick="if(confirm('Reset data?')){ DB.clear(); location.reload(); }">Reset</button>
        </div>
      </div>`;
  }
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  document.getElementById('year').textContent = new Date().getFullYear();

  try { state = DB.load(); } catch (e) { state = null; }

  // First run → empty state
  if (!state || !state.org) {
    try { seed(); } catch (e) { console.error('Seed failed:', e); }
  }

  state = state || {};
  ['members','units','accounts','journalEntries','journalLines','loans','campaigns',
   'shareholdings','notifications','auditLogs']
    .forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
  if (!state.org) state.org = { ...CONFIG.org, name: CONFIG.brand.name };

  try { ensureSystemAccounts(); } catch (e) { console.error(e); }
  try {
    state.members.forEach(m => {
      if (!state.shareholdings.find(s => s.membershipId === m.id))
        state.shareholdings.push({ id: uid('sh_'), membershipId: m.id, sharesOwned: 0, totalInvested: 0 });
    });
  } catch (e) { console.error(e); }

  currentUser = state.members.find(m => m.role === 'ADMIN') || state.members[0] || null;

  try { buildNav(); } catch (e) { console.error(e); }

  window.addEventListener('hashchange', safeRender);
  window.addEventListener('error', e => console.error('Uncaught:', e.error || e.message));

  safeRender();
})();
</script>
</body>
</html>
