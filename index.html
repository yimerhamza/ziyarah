<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--b900:#062a26;--b800:#0b3d36;--b700:#0f5248;--b600:#146b5d;--gold:#c9a227;--bg:#f6f8f8;}
  *{font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  body{background:var(--bg);}
  .nav-link{transition:.15s;border-left:3px solid transparent;color:#5a6b68;cursor:pointer;display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem;font-size:.875rem;}
  .nav-link:hover{background:#eef3f2;color:var(--b700);}
  .nav-link.active{background:#e8f2f0;color:var(--b700);border-left-color:var(--gold);font-weight:600;}
  .nav-link .nav-icon{color:#8a9a97;width:18px;text-align:center;}
  .nav-link.active .nav-icon{color:var(--b600);}
  .inp{width:100%;border:1px solid #d4dcda;border-radius:.55rem;padding:.55rem .8rem;font-size:.875rem;outline:none;background:#fff;transition:.15s;}
  .inp:focus{border-color:var(--b600);box-shadow:0 0 0 3px rgba(26,136,116,.12);}
  .btn{border-radius:.55rem;padding:.55rem 1rem;font-size:.8125rem;font-weight:600;cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-p{background:var(--b700);color:#fff;}.btn-p:hover:not(:disabled){background:var(--b800);}
  .btn-gold{background:var(--gold);color:#fff;}.btn-gold:hover:not(:disabled){background:#b08e1e;}
  .btn-g{background:#059669;color:#fff;}.btn-g:hover:not(:disabled){background:#047857;}
  .btn-r{background:#dc2626;color:#fff;}.btn-r:hover:not(:disabled){background:#b91c1c;}
  .btn-s{background:#e8edec;color:var(--b800);}.btn-s:hover:not(:disabled){background:#d4dcda;}
  .btn-xs{padding:.3rem .6rem;font-size:.72rem;}
  .card{background:#fff;border:1px solid #e5ebe9;border-radius:.85rem;box-shadow:0 1px 2px rgba(6,42,38,.03);}
  table{width:100%;border-collapse:collapse;font-size:.875rem;}
  th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:#7a8a87;padding:.6rem .75rem;border-bottom:1px solid #e5ebe9;font-weight:700;}
  td{padding:.65rem .75rem;border-bottom:1px solid #f1f5f4;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;}
  .brand-gradient{background:linear-gradient(135deg,var(--b900) 0%,var(--b700) 55%,var(--b600) 100%);}
  .gold-underline{position:relative;}
  .gold-underline::after{content:'';position:absolute;bottom:-6px;left:0;width:48px;height:3px;background:var(--gold);border-radius:2px;}
  #toast{position:fixed;top:1.25rem;right:1.25rem;z-index:100;display:flex;flex-direction:column;gap:.5rem;max-width:380px;}
  .toast-item{padding:.7rem 1rem;border-radius:.6rem;font-size:.83rem;font-weight:600;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:slideIn .25s ease;}
  @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  .toast-ok{background:#059669;}.toast-err{background:#dc2626;}.toast-info{background:var(--b700);}
  .kpi-value{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  .divider{height:1px;background:#e5ebe9;margin:.9rem 0;}
  .empty{padding:2rem;text-align:center;color:#9aa8a5;font-size:.85rem;}
  .modal-bg{position:fixed;inset:0;background:rgba(6,42,38,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:1rem;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:1rem;max-width:640px;width:100%;max-height:90vh;overflow:auto;position:relative;}
  .sidebar{width:230px;transition:transform .2s;}
  @media(max-width:1023px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:50;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-bg{position:fixed;inset:0;background:rgba(6,42,38,.4);z-index:49;display:none;}
    .sidebar-bg.show{display:block;}
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c8d2d0;border-radius:4px;}
  pre{font-family:'JetBrains Mono',monospace;}
  .modal-close{position:absolute;top:.75rem;right:.75rem;background:transparent;border:none;font-size:1.5rem;color:#94a3b8;cursor:pointer;line-height:1;padding:0;}
  .modal-close:hover{color:#0f172a;}
  .env-badge{position:fixed;bottom:1rem;left:1rem;z-index:80;padding:.35rem .7rem;border-radius:.4rem;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#059669;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .action-btns{display:flex;gap:.3rem;justify-content:flex-end;flex-wrap:wrap;}
  .search-box{position:relative;}
  .search-box::before{content:'⌕';position:absolute;left:.75rem;top:.5rem;color:#94a3b8;font-size:1.1rem;pointer-events:none;}
  .search-box .inp{padding-left:2.25rem;}
  .onboard-card{background:#fff;border:1px solid #e5ebe9;border-radius:.85rem;padding:1.25rem;transition:.15s;cursor:pointer;text-align:left;width:100%;}
  .onboard-card:hover{border-color:var(--b600);box-shadow:0 4px 16px rgba(15,82,72,.08);transform:translateY(-1px);}
  .onboard-icon{width:44px;height:44px;border-radius:.65rem;display:grid;place-items:center;font-size:1.25rem;font-weight:800;}
  .progress-step{display:flex;align-items:center;gap:.75rem;padding:.65rem;border-radius:.5rem;}
  .progress-step.done{background:#ecfdf5;}
  .progress-step.pending{background:#f8fafb;}
  .step-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;flex-shrink:0;}
</style>
</head>
<body>

<div class="env-badge">● LOCAL</div>

<div class="flex min-h-screen">
  <div class="sidebar-bg" id="sidebarBg" onclick="toggleSidebar()"></div>

  <aside class="sidebar bg-white border-r border-[#e5ebe9] flex flex-col fixed lg:sticky top-0 h-screen z-50" id="sidebar">
    <div class="brand-gradient text-white p-4">
      <div class="flex items-center gap-3">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0b83a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="font-extrabold text-[13px] leading-tight truncate">ZIYARAH</div>

        </div>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto py-3" id="navMenu"></nav>
    <div class="p-4 border-t border-[#e5ebe9] text-[11px] text-slate-400">
      <div class="flex justify-between mb-1"><span>Currency</span><span class="mono font-bold" id="sideCurrency">—</span></div>
      <div class="flex justify-between"><span>Records</span><span class="mono" id="sideRecords">0</span></div>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="bg-white border-b border-[#e5ebe9] sticky top-0 z-30">
      <div class="px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button class="lg:hidden btn btn-s !p-2" onclick="toggleSidebar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="min-w-0">
            <div class="text-[11px] text-slate-400 leading-tight" id="breadcrumb">Home</div>
            <div class="text-sm font-bold text-[#062a26] leading-tight truncate" id="pageTitle">Dashboard</div>
          </div>

        <div class="flex items-center gap-2">

            <div class="hidden md:block">
              <div class="text-xs font-bold text-slate-700 leading-tight" id="userName">—</div>

    </header>

    <main id="view" class="flex-1 p-4 sm:p-6 pb-20"></main>

    <footer class="border-t border-[#e5ebe9] bg-white px-4 sm:px-6 py-3 text-xs text-slate-400 flex justify-between flex-wrap gap-2">
      <span>© <span id="year"></span> ZIYARAH DIGITAL BUSINESS GROUP</span>
      <span><span id="footerRecords">0</span> records · <span id="footerSize">0 KB</span></span>
    </footer>
  </div>

<div id="toast"></div>

  <div class="modal p-6" id="modalContent"></div>

<script>
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  env: 'local',
  schemaVersion: 7,
  storageKey: 'ziyarah_dbg_v7',
  brand: { name: 'ZIYARAH DIGITAL BUSINESS GROUP', short: 'ZIYARAH', sub: 'DIGITAL BUSINESS GROUP' },
  org: {
    slug: 'ziyarah-dbg', legalName: '',
    country: 'ET', currency: 'ETB', symbol: 'Br', sharePrice: 100, founded: '',
  },
  rules: {
    defaultInterestRate: 10, defaultTermMonths: 6,
    maxLoanMultiplier: 3, dividendCapPercent: 50, minSavingsForLoan: 1000,
  },
  roles: {
    ADMIN: 'Administrator', TREASURER: 'Treasurer', LOAN_OFFICER: 'Loan Officer',
    AUDITOR: 'Auditor', MEMBER: 'Member',
  },
  statuses: {
    member: ['ACTIVE','SUSPENDED','EXITED'],
    unit: ['PLANNING','ACTIVE','PAUSED','CLOSED'],
  },
  nav: [
    { section: 'Overview' },
    { route: 'dashboard', label: 'Dashboard', icon: '◈' },
    { section: 'People' },
    { route: 'members',  label: 'Members',       icon: '◉' },
    { route: 'units',    label: 'Business Units', icon: '▣' },
    { section: 'Money' },
    { route: 'savings',  label: 'Savings',    icon: '◐' },
    { route: 'loans',    label: 'Loans',      icon: '◑' },
    { route: 'support',  label: 'Support',    icon: '♡' },
    { route: 'shares',   label: 'Shares',     icon: '◆' },
    { section: 'Records' },
    { route: 'ledger',   label: 'Ledger',     icon: '▤' },
    { route: 'reports',  label: 'Reports',    icon: '▦' },
    { route: 'settings', label: 'Settings',   icon: '⚙' },
  ],
  systemAccounts: [
    { code: '1000', name: 'Cash & Bank',      type: 'ASSET',     normal: 'DEBIT'  },
    { code: '2200', name: 'Dividends Payable',type: 'LIABILITY', normal: 'CREDIT' },
    { code: '3100', name: 'Group Equity',     type: 'EQUITY',    normal: 'CREDIT' },
    { code: '4000', name: 'Interest Income',  type: 'INCOME',    normal: 'CREDIT' },
  ],
};

/* ============================================================
   UTILITIES
   ============================================================ */
const uid   = p => p + Math.random().toString(36).slice(2, 9);
const esc   = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num   = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const round = n => Math.round(n * 100) / 100;
const fmt   = n => Number(n || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const money = n => `${state?.org?.symbol || 'Br'} ${fmt(n)}`;
const dtShort = iso => new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
const dtLong  = iso => new Date(iso).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'});
const mName = id => (state.members.find(m => m.id === id) || {}).name || '—';
const cName = id => (state.campaigns.find(c => c.id === id) || {}).name || '—';
const initials = n => String(n || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

/* ============================================================
   STATE + DB
   ============================================================ */
let state = null;
let currentUser = null;

const DB = {
  load(){ try { return JSON.parse(localStorage.getItem(CONFIG.storageKey)); } catch { return null; } },
  save(){
    try {
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
      updateStats();
    } catch (e) { console.error(e); toast('Save failed: ' + e.message, 'err'); }
  },
  clear(){ localStorage.removeItem(CONFIG.storageKey); },
  sizeKB(){ return ((localStorage.getItem(CONFIG.storageKey) || '').length / 1024).toFixed(1); },
  count(){
    if (!state) return 0;
    return ['members','units','accounts','journalEntries','journalLines','loans','campaigns',
            'shareholdings','notifications','auditLogs']
      .reduce((s, k) => s + (state[k]?.length || 0), 0);
  },
  export(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ziyarah-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  },
  import(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = e => {
        try {
          const d = JSON.parse(e.target.result);
          if (!d.org || !Array.isArray(d.members)) throw new Error('Invalid file structure');
          state = d; DB.save(); resolve();
        } catch (err) { reject(err); }
      };
      r.onerror = () => reject(new Error('Could not read file'));
      r.readAsText(file);
    });
  },
};

/* ============================================================
   LEDGER
   ============================================================ */
const Ledger = {
  account(code){ return state.accounts.find(a => a.code === code); },
  balance(code){ const a = Ledger.account(code); return a ? round(num(a.balance)) : 0; },
  totalByType(t){ return round(state.accounts.filter(a => a.type === t).reduce((s, a) => s + num(a.balance), 0)); },
  totalByPrefix(p){ return round(state.accounts.filter(a => a.code.startsWith(p)).reduce((s, a) => s + num(a.balance), 0)); },

  post({ description, type, reference, lines, metadata }){
    const dr = lines.reduce((s, l) => s + num(l.debit), 0);
    const cr = lines.reduce((s, l) => s + num(l.credit), 0);
    if (Math.abs(dr - cr) > 0.001)
      throw new Error(`Unbalanced entry (Dr ${dr.toFixed(2)} ≠ Cr ${cr.toFixed(2)})`);

    const resolved = lines.filter(l => num(l.debit) || num(l.credit)).map(l => {
      const acc = Ledger.account(l.accountCode);
      if (!acc) throw new Error(`Account not found: ${l.accountCode}`);
      return { acc, debit: round(num(l.debit)), credit: round(num(l.credit)), memo: l.memo };
    });

    const entry = {
      id: uid('je_'), date: new Date().toISOString(), description, type,
      reference: reference || null, metadata: metadata || {},
      createdById: currentUser?.id || 'system',
    };
    state.journalEntries.push(entry);

    for (const r of resolved) {
      state.journalLines.push({
        id: uid('jl_'), journalEntryId: entry.id, accountId: r.acc.id,
        debit: r.debit, credit: r.credit, memo: r.memo || null,
      });
      const isDebitNormal = r.acc.normal === 'DEBIT';
      const delta = r.debit - r.credit;
      r.acc.balance = round(num(r.acc.balance) + (isDebitNormal ? delta : -delta));
    }
    return entry;
  },

  reverse(entryId, reason){
    const entry = state.journalEntries.find(e => e.id === entryId);
    if (!entry) throw new Error('Entry not found');
    if (entry.reversedAt) throw new Error('Entry already reversed');

    const lines = state.journalLines.filter(l => l.journalEntryId === entryId);

    for (const l of lines) {
      const acc = state.accounts.find(a => a.id === l.accountId);
      if (!acc) continue;
      if (acc.normal === 'CREDIT') {
        const reversalDelta = num(l.credit) - num(l.debit);
        const postBalance = num(acc.balance) - reversalDelta;
        if (postBalance < -0.01) {
          throw new Error(
            `Cannot reverse: ${acc.name} would go negative (${money(postBalance)}). ` +
            `Adjust the account first.`
          );
        }
      }
    }

    const reversed = lines.map(l => {
      const acc = state.accounts.find(a => a.id === l.accountId);
      return { accountCode: acc.code, debit: num(l.credit), credit: num(l.debit), memo: 'Reversal' };
    });

    const rev = Ledger.post({
      description: `REVERSAL · ${entry.description}${reason ? ' — ' + reason : ''}`,
      type: 'REVERSAL',
      reference: entry.id,
      lines: reversed,
      metadata: { reversalOf: entryId, reason },
    });
    entry.reversedAt = new Date().toISOString();
    return rev;
  },

  verify(){
    let dr = 0, cr = 0;
    for (const l of state.journalLines) { dr += num(l.debit); cr += num(l.credit); }
    return { balanced: Math.abs(dr - cr) < 0.01, debit: round(dr), credit: round(cr) };
  },

  rebuild(){
    state.accounts.forEach(a => a.balance = 0);
    for (const line of state.journalLines) {
      const acc = state.accounts.find(a => a.id === line.accountId);
      if (!acc) continue;
      const isDebitNormal = acc.normal === 'DEBIT';
      const delta = num(line.debit) - num(line.credit);
      acc.balance = round(num(acc.balance) + (isDebitNormal ? delta : -delta));
    }
  },
};

/* ============================================================
   AUDIT
   ============================================================ */
function audit(action, entityType, entityId, before, after){
  state.auditLogs.push({
    id: uid('al_'), action, entityType, entityId,
    before: before || null, after: after || null,
    userId: currentUser?.id || 'system',
    createdAt: new Date().toISOString(),
  });
}

/* ============================================================
   ACCOUNT OPENERS
   ============================================================ */
function ensureSystemAccounts(){
  CONFIG.systemAccounts.forEach(sa => {
    if (!Ledger.account(sa.code)) {
      state.accounts.push({
        id: uid('ac_'), code: sa.code, name: sa.name,
        type: sa.type, normal: sa.normal, balance: 0,
        membershipId: null, isSystem: true,
      });
    }
  });
}

function ensureMemberAccounts(memberId){
  const defs = [
    { code: `SAV-${memberId}`,  name: 'Member Savings',  type: 'LIABILITY', normal: 'CREDIT' },
    { code: `LOAN-${memberId}`, name: 'Loan Receivable', type: 'ASSET',     normal: 'DEBIT'  },
    { code: `SHR-${memberId}`,  name: 'Share Capital',   type: 'EQUITY',    normal: 'CREDIT' },
  ];
  defs.forEach(d => {
    if (!Ledger.account(d.code)) {
      state.accounts.push({
        id: uid('ac_'), code: d.code, name: d.name,
        type: d.type, normal: d.normal, balance: 0,
        membershipId: memberId, isSystem: false,
      });
    }
  });
}

function ensureUnitAccount(unitId, unitName){
  const code = `UNIT-${unitId}`;
  if (!Ledger.account(code)) {
    state.accounts.push({
      id: uid('ac_'), code, name: `Unit Capital · ${unitName}`,
      type: 'EQUITY', normal: 'CREDIT', balance: 0,
      unitId, isSystem: false,
    });
  }
}

function ensureCampaignAccount(campaignId, campaignName){
  const code = `CAMP-${campaignId}`;
  if (!Ledger.account(code)) {
    state.accounts.push({
      id: uid('ac_'), code, name: `Support Fund · ${campaignName}`,
      type: 'LIABILITY', normal: 'CREDIT', balance: 0,
      membershipId: null, isSystem: false,
    });
  }
}

/* ============================================================
   MEMBER SERVICE
   ============================================================ */
const MemberService = {
  list(){ return state.members.filter(m => !m.deletedAt); },

  create({ name, phone, email, role, status }){
    name = (name || '').trim();
    if (!name) throw new Error('Name is required');
    if (phone && state.members.some(m => m.phone === phone && !m.deletedAt))
      throw new Error('Phone already registered');

    const member = {
      id: uid('m_'),
      name, phone: (phone || '').trim(), email: (email || '').trim(),
      role: role || 'MEMBER', status: status || 'ACTIVE',
      memberNumber: 'ZDBG-' + String(state.members.length + 1).padStart(4, '0'),
      joinedAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    state.members.push(member);
    ensureMemberAccounts(member.id);
    if (!state.shareholdings.find(s => s.membershipId === member.id))
      state.shareholdings.push({ id: uid('sh_'), membershipId: member.id, sharesOwned: 0, totalInvested: 0 });
    audit('member.create', 'Member', member.id, null, member);
    return member;
  },

  update(id, patch){
    const m = state.members.find(x => x.id === id);
    if (!m) throw new Error('Member not found');
    const before = { ...m };
    Object.assign(m, patch, { updatedAt: new Date().toISOString() });
    audit('member.update', 'Member', id, before, patch);
    return m;
  },

  remove(id){
    const m = state.members.find(x => x.id === id);
    if (!m) throw new Error('Member not found');
    if (state.loans.some(l => l.membershipId === id && l.status === 'DISBURSED'))
      throw new Error('Cannot delete: member has an active loan');

    const sav  = Ledger.balance(`SAV-${id}`);
    const loan = Ledger.balance(`LOAN-${id}`);
    const shr  = Ledger.balance(`SHR-${id}`);
    if (Math.abs(sav) > 0.01 || Math.abs(loan) > 0.01 || Math.abs(shr) > 0.01) {
      throw new Error(
        `Cannot delete: member has balances (Savings ${money(sav)}, Loan ${money(loan)}, Shares ${money(shr)}).`
      );
    }
    m.deletedAt = new Date().toISOString();
    m.status = 'EXITED';
    audit('member.delete', 'Member', id, { name: m.name }, null);
  },

  forceRemove(id){
    const m = state.members.find(x => x.id === id);
    if (!m) throw new Error('Member not found');
    if (state.loans.some(l => l.membershipId === id && l.status === 'DISBURSED'))
      throw new Error('Cannot force delete: member has an active loan.');

    const sav  = Ledger.balance(`SAV-${id}`);
    const loan = Ledger.balance(`LOAN-${id}`);
    const shr  = Ledger.balance(`SHR-${id}`);

    if (Math.abs(sav) > 0.01) {
      if (sav > 0) {
        Ledger.post({
          description: `Member exit payout · ${m.name}`,
          type: 'ADJUSTMENT',
          lines: [
            { accountCode: `SAV-${id}`, debit: sav },
            { accountCode: '1000', credit: sav },
          ],
          metadata: { memberId: id, amount: sav, reason: 'exit_payout' },
        });
      } else {
        Ledger.post({
          description: `Negative savings write-off · ${m.name}`,
          type: 'ADJUSTMENT',
          lines: [
            { accountCode: `SAV-${id}`, debit: Math.abs(sav) },
            { accountCode: '3100', credit: Math.abs(sav) },
          ],
          metadata: { memberId: id, amount: sav, reason: 'write_off' },
        });
      }
    }

    if (Math.abs(loan) > 0.01) {
      Ledger.post({
        description: `Loan residual write-off · ${m.name}`,
        type: 'ADJUSTMENT',
        lines: [
          { accountCode: '3100', debit: Math.abs(loan) },
          { accountCode: `LOAN-${id}`, credit: Math.abs(loan) },
        ],
        metadata: { memberId: id, amount: loan, reason: 'write_off' },
      });
    }

    if (Math.abs(shr) > 0.01) {
      Ledger.post({
        description: `Share redemption · ${m.name}`,
        type: 'ADJUSTMENT',
        lines: [
          { accountCode: `SHR-${id}`, debit: shr },
          { accountCode: '1000', credit: shr },
        ],
        metadata: { memberId: id, amount: shr, reason: 'share_redemption' },
      });
    }

    const sh = state.shareholdings.find(s => s.membershipId === id);
    if (sh) { sh.sharesOwned = 0; sh.totalInvested = 0; }

    m.deletedAt = new Date().toISOString();
    m.status = 'EXITED';
    audit('member.force_delete', 'Member', id,
      { name: m.name, balances: { sav, loan, shr } }, null);
  },
};

/* ============================================================
   UNIT SERVICE
   ============================================================ */
const UnitService = {
  list(){ return state.units.filter(u => !u.deletedAt); },

  create({ name, description, managerId, capital, status, category }){
    name = (name || '').trim();
    if (!name) throw new Error('Unit name required');
    if (state.units.some(u => u.name === name && !u.deletedAt))
      throw new Error('A unit with this name already exists');

    const unit = {
      id: uid('u_'),
      code: 'BU-' + String(state.units.length + 1).padStart(3, '0'),
      name,
      description: (description || '').trim(),
      managerId: managerId || null,
      category: (category || 'General').trim(),
      initialCapital: round(num(capital)),
      status: status || 'PLANNING',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    state.units.push(unit);
    ensureUnitAccount(unit.id, unit.name);

    if (unit.initialCapital > 0) {
      Ledger.post({
        description: `Capital allocation · ${unit.name}`,
        type: 'CAPITAL_INJECTION',
        reference: unit.code,
        lines: [
          { accountCode: '1000', debit: unit.initialCapital },
          { accountCode: `UNIT-${unit.id}`, credit: unit.initialCapital },
        ],
        metadata: { unitId: unit.id, amount: unit.initialCapital },
      });
    }
    audit('unit.create', 'BusinessUnit', unit.id, null, unit);
    return unit;
  },

  update(id, patch){
    const u = state.units.find(x => x.id === id);
    if (!u) throw new Error('Unit not found');
    const before = { ...u };

    if (patch.initialCapital !== undefined && round(num(patch.initialCapital)) !== num(u.initialCapital)) {
      const diff = round(num(patch.initialCapital) - num(u.initialCapital));
      if (diff > 0) {
        Ledger.post({
          description: `Capital increase · ${u.name}`,
          type: 'CAPITAL_INJECTION',
          reference: u.code,
          lines: [
            { accountCode: '1000', debit: diff },
            { accountCode: `UNIT-${id}`, credit: diff },
          ],
          metadata: { unitId: id, amount: diff },
        });
      } else {
        Ledger.post({
          description: `Capital decrease · ${u.name}`,
          type: 'CAPITAL_INJECTION',
          reference: u.code,
          lines: [
            { accountCode: `UNIT-${id}`, debit: Math.abs(diff) },
            { accountCode: '1000', credit: Math.abs(diff) },
          ],
          metadata: { unitId: id, amount: diff },
        });
      }
    }

    Object.assign(u, patch, { updatedAt: new Date().toISOString() });
    audit('unit.update', 'BusinessUnit', id, before, patch);
    return u;
  },

  remove(id){
    const u = state.units.find(x => x.id === id);
    if (!u) throw new Error('Unit not found');
    const balance = Ledger.balance(`UNIT-${id}`);
    if (Math.abs(balance) > 0.01)
      throw new Error(`Cannot delete: unit holds ${money(balance)} in capital.`);
    u.deletedAt = new Date().toISOString();
    u.status = 'CLOSED';
    audit('unit.delete', 'BusinessUnit', id, { name: u.name }, null);
  },

  forceRemove(id){
    const u = state.units.find(x => x.id === id);
    if (!u) throw new Error('Unit not found');
    const cap = Ledger.balance(`UNIT-${id}`);
    if (Math.abs(cap) > 0.01) {
      Ledger.post({
        description: `Unit capital return · ${u.name}`,
        type: 'ADJUSTMENT',
        reference: u.code,
        lines: [
          { accountCode: `UNIT-${id}`, debit: cap },
          { accountCode: '1000', credit: cap },
        ],
        metadata: { unitId: id, amount: cap, reason: 'capital_return' },
      });
    }
    u.deletedAt = new Date().toISOString();
    u.status = 'CLOSED';
    audit('unit.force_delete', 'BusinessUnit', id, { name: u.name, capital: cap }, null);
  },

  writeOff(id){
    const u = state.units.find(x => x.id === id);
    if (!u) throw new Error('Unit not found');
    const cap = Ledger.balance(`UNIT-${id}`);
    if (cap > 0.01) {
      Ledger.post({
        description: `Unit capital write-off · ${u.name}`,
        type: 'ADJUSTMENT',
        reference: u.code,
        lines: [
          { accountCode: `UNIT-${id}`, debit: cap },
          { accountCode: '3100', credit: cap },
        ],
        metadata: { unitId: id, amount: cap, reason: 'write_off' },
      });
    }
    u.deletedAt = new Date().toISOString();
    u.status = 'CLOSED';
    audit('unit.write_off', 'BusinessUnit', id, { name: u.name, amount: cap }, null);
  },
};

/* ============================================================
   SAVINGS SERVICE
   ============================================================ */
const SavingsService = {
  deposit(memberId, amount, note){
    amount = round(num(amount));
    if (amount <= 0) throw new Error('Amount must be greater than zero');
    const m = state.members.find(x => x.id === memberId);
    if (!m) throw new Error('Member not found');
    if (m.status !== 'ACTIVE') throw new Error('Member is not active');

    const entry = Ledger.post({
      description: `Savings deposit · ${m.name}`,
      type: 'SAVINGS_DEPOSIT',
      lines: [
        { accountCode: '1000', debit: amount },
        { accountCode: `SAV-${memberId}`, credit: amount, memo: note },
      ],
      metadata: { memberId, amount, note },
    });
    audit('savings.deposit', 'JournalEntry', entry.id, null, { memberId, amount });
    return entry;
  },

  withdraw(memberId, amount){
    amount = round(num(amount));
    if (amount <= 0) throw new Error('Amount must be greater than zero');
    const bal = Ledger.balance(`SAV-${memberId}`);
    if (bal < amount) throw new Error(`Insufficient balance (available: ${money(bal)})`);

    const entry = Ledger.post({
      description: `Savings withdrawal · ${mName(memberId)}`,
      type: 'SAVINGS_WITHDRAWAL',
      lines: [
        { accountCode: `SAV-${memberId}`, debit: amount },
        { accountCode: '1000', credit: amount },
      ],
      metadata: { memberId, amount },
    });
    audit('savings.withdraw', 'JournalEntry', entry.id, null, { memberId, amount });
    return entry;
  },

  reverse(entryId, reason){
    Ledger.reverse(entryId, reason);
    audit('entry.reverse', 'JournalEntry', entryId, null, { reason });
  },
};

/* ============================================================
   LOAN SERVICE
   ============================================================ */
const LoanService = {
  list(){ return state.loans.filter(l => !l.deletedAt); },

  request(memberId, principal, ratePct, termMonths, purpose){
    principal = round(num(principal));
    ratePct = num(ratePct) || CONFIG.rules.defaultInterestRate;
    termMonths = Math.max(1, parseInt(termMonths) || CONFIG.rules.defaultTermMonths);
    if (principal <= 0) throw new Error('Principal must be greater than zero');

    const m = state.members.find(x => x.id === memberId);
    if (!m) throw new Error('Member not found');

    const savings = Ledger.balance(`SAV-${memberId}`);
    if (savings < CONFIG.rules.minSavingsForLoan)
      throw new Error(`Minimum savings required: ${money(CONFIG.rules.minSavingsForLoan)}`);

    const maxLoan = savings * CONFIG.rules.maxLoanMultiplier;
    if (principal > maxLoan) throw new Error(`Max loan for this member: ${money(maxLoan)}`);

    const interest = round(principal * ratePct / 100);
    const totalDue = round(principal + interest);

    const loan = {
      id: uid('ln_'),
      loanNumber: 'LN-' + String(state.loans.length + 1).padStart(4, '0'),
      membershipId: memberId,
      principal, interestRate: ratePct, termMonths,
      totalInterest: interest, totalDue,
      monthlyPayment: round(totalDue / termMonths),
      outstandingPrincipal: 0, outstandingInterest: 0,
      status: 'REQUESTED', purpose: purpose || '',
      requestedAt: new Date().toISOString(),
      repayments: [],
    };
    state.loans.push(loan);
    audit('loan.request', 'Loan', loan.id, null, { memberId, principal });
    return loan;
  },

  approve(id){
    const ln = state.loans.find(l => l.id === id);
    if (!ln || ln.status !== 'REQUESTED') throw new Error('Loan not in REQUESTED state');
    ln.status = 'APPROVED'; ln.approvedAt = new Date().toISOString();
    audit('loan.approve', 'Loan', id, null, {});
  },

  reject(id, reason){
    const ln = state.loans.find(l => l.id === id);
    if (!ln || ln.status !== 'REQUESTED') throw new Error('Loan not in REQUESTED state');
    ln.status = 'REJECTED'; ln.rejectedReason = reason || '';
    audit('loan.reject', 'Loan', id, null, { reason });
  },

  disburse(id){
    const ln = state.loans.find(l => l.id === id);
    if (!ln || ln.status !== 'APPROVED') throw new Error('Loan must be APPROVED');
    if (Ledger.balance('1000') < ln.principal) throw new Error('Insufficient cash to disburse');

    Ledger.post({
      description: `Loan disbursement · ${mName(ln.membershipId)}`,
      type: 'LOAN_DISBURSEMENT',
      reference: ln.loanNumber,
      lines: [
        { accountCode: `LOAN-${ln.membershipId}`, debit: ln.principal },
        { accountCode: '1000', credit: ln.principal },
      ],
      metadata: { loanId: id, memberId: ln.membershipId, amount: ln.principal },
    });

    ln.status = 'DISBURSED';
    ln.disbursedAt = new Date().toISOString();
    ln.outstandingPrincipal = ln.principal;
    ln.outstandingInterest = ln.totalInterest;
    audit('loan.disburse', 'Loan', id, null, { amount: ln.principal });
  },

  repay(id, amount){
    amount = round(num(amount));
    if (amount <= 0) throw new Error('Repayment must be greater than zero');
    const ln = state.loans.find(l => l.id === id);
    if (!ln || ln.status !== 'DISBURSED') throw new Error('Loan not DISBURSED');

    let rem = amount;
    const intPart = Math.min(rem, ln.outstandingInterest);
    ln.outstandingInterest = round(ln.outstandingInterest - intPart);
    rem = round(rem - intPart);
    const prinPart = Math.min(rem, ln.outstandingPrincipal);
    ln.outstandingPrincipal = round(ln.outstandingPrincipal - prinPart);
    rem = round(rem - prinPart);
    const overpay = rem;

    const lines = [{ accountCode: '1000', debit: amount }];
    if (prinPart > 0) lines.push({ accountCode: `LOAN-${ln.membershipId}`, credit: prinPart });
    if (intPart  > 0) lines.push({ accountCode: '4000', credit: intPart });
    if (overpay  > 0) lines.push({ accountCode: `SAV-${ln.membershipId}`, credit: overpay });

    Ledger.post({
      description: `Loan repayment · ${mName(ln.membershipId)}`,
      type: 'LOAN_REPAYMENT',
      reference: ln.loanNumber,
      lines,
      metadata: { loanId: id, memberId: ln.membershipId, amount, prinPart, intPart, overpay },
    });

    ln.repayments.push({ id: uid('rp_'), date: new Date().toISOString(), amount, prinPart, intPart, overpay });
    if (ln.outstandingPrincipal <= 0.001 && ln.outstandingInterest <= 0.001)
      ln.status = 'REPAID';
    audit('loan.repay', 'Loan', id, null, { amount });
  },

  writeOff(id){
    const ln = state.loans.find(l => l.id === id);
    if (!ln || ln.status !== 'DISBURSED') throw new Error('Only DISBURSED loans can be written off');
    const totalOut = round(ln.outstandingPrincipal + ln.outstandingInterest);
    if (totalOut < 0.01) throw new Error('Nothing to write off');

    Ledger.post({
      description: `Loan write-off · ${mName(ln.membershipId)}`,
      type: 'ADJUSTMENT',
      reference: ln.loanNumber,
      lines: [
        { accountCode: '3100', debit: totalOut },
        { accountCode: `LOAN-${ln.membershipId}`, credit: totalOut },
      ],
      metadata: { loanId: id, memberId: ln.membershipId, amount: totalOut, reason: 'bad_debt' },
    });

    ln.outstandingPrincipal = 0;
    ln.outstandingInterest = 0;
    ln.status = 'DEFAULTED';
    ln.writtenOffAt = new Date().toISOString();
    audit('loan.write_off', 'Loan', id, null, { amount: totalOut });
  },
};

/* ============================================================
   CAMPAIGN SERVICE
   ============================================================ */
const CampaignService = {
  list(){ return state.campaigns.filter(c => !c.deletedAt); },

  create({ name, target, description }){
    name = (name || '').trim();
    if (!name) throw new Error('Campaign name required');
    const c = {
      id: uid('c_'), name,
      description: (description || '').trim(),
      targetAmount: round(num(target)),
      raisedAmount: 0, status: 'ACTIVE',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    state.campaigns.push(c);
    ensureCampaignAccount(c.id, c.name);
    audit('campaign.create', 'Campaign', c.id, null, { name });
    return c;
  },

  update(id, patch){
    const c = state.campaigns.find(x => x.id === id);
    if (!c) throw new Error('Campaign not found');
    const before = { ...c };
    Object.assign(c, patch, { updatedAt: new Date().toISOString() });
    audit('campaign.update', 'Campaign', id, before, patch);
  },

  remove(id){
    const c = state.campaigns.find(x => x.id === id);
    if (!c) throw new Error('Campaign not found');
    const raised = Ledger.balance(`CAMP-${id}`);
    if (raised > 0.01)
      throw new Error(`Cannot delete: campaign holds ${money(raised)}.`);
    c.deletedAt = new Date().toISOString();
    c.status = 'CANCELLED';
    audit('campaign.delete', 'Campaign', id, { name: c.name }, null);
  },

  contribute(memberId, campaignId, amount){
    amount = round(num(amount));
    if (amount <= 0) throw new Error('Amount must be greater than zero');
    const c = state.campaigns.find(x => x.id === campaignId);
    if (!c || c.deletedAt) throw new Error('Campaign not found');
    if (c.status !== 'ACTIVE') throw new Error('Campaign is not active');

    Ledger.post({
      description: `Support · ${mName(memberId)} → ${c.name}`,
      type: 'SUPPORT_CONTRIBUTION',
      reference: campaignId,
      lines: [
        { accountCode: '1000', debit: amount },
        { accountCode: `CAMP-${campaignId}`, credit: amount },
      ],
      metadata: { memberId, campaignId, amount },
    });
    c.raisedAmount = round(num(c.raisedAmount) + amount);
    audit('campaign.contribute', 'Campaign', campaignId, null, { memberId, amount });
  },

  contributors(campaignId){
    const contribs = {};
    for (const e of state.journalEntries) {
      if (e.type === 'SUPPORT_CONTRIBUTION' && e.metadata?.campaignId === campaignId) {
        contribs[e.metadata.memberId] = round((contribs[e.metadata.memberId] || 0) + num(e.metadata.amount));
      }
    }
    return contribs;
  },
};

/* ============================================================
   SHARE SERVICE
   ============================================================ */
const ShareService = {
  buy(memberId, quantity, price){
    quantity = parseInt(quantity);
    price = round(num(price)) || state.org.sharePrice;
    if (!quantity || quantity <= 0) throw new Error('Quantity must be greater than zero');
    const total = round(quantity * price);
    const sav = Ledger.balance(`SAV-${memberId}`);
    if (sav < total) throw new Error(`Insufficient savings (have ${money(sav)}, need ${money(total)})`);

    Ledger.post({
      description: `Share purchase · ${mName(memberId)} × ${quantity}`,
      type: 'SHARE_PURCHASE',
      lines: [
        { accountCode: `SAV-${memberId}`, debit: total },
        { accountCode: `SHR-${memberId}`, credit: total },
      ],
      metadata: { memberId, quantity, price, amount: total },
    });

    const sh = state.shareholdings.find(s => s.membershipId === memberId);
    if (sh) { sh.sharesOwned += quantity; sh.totalInvested = round(num(sh.totalInvested) + total); }
    audit('share.buy', 'Shareholding', memberId, null, { quantity, total });
  },

  sell(memberId, quantity, price){
    quantity = parseInt(quantity);
    price = round(num(price)) || state.org.sharePrice;
    if (!quantity || quantity <= 0) throw new Error('Quantity must be greater than zero');
    const sh = state.shareholdings.find(s => s.membershipId === memberId);
    if (!sh || sh.sharesOwned < quantity) throw new Error('Insufficient shares to sell');
    const total = round(quantity * price);

    Ledger.post({
      description: `Share sale · ${mName(memberId)} × ${quantity}`,
      type: 'SHARE_SALE',
      lines: [
        { accountCode: `SHR-${memberId}`, debit: total },
        { accountCode: '1000', credit: total },
      ],
      metadata: { memberId, quantity, price, amount: total },
    });
    sh.sharesOwned -= quantity;
    sh.totalInvested = round(num(sh.totalInvested) - total);
    audit('share.sell', 'Shareholding', memberId, null, { quantity, total });
  },
};

/* ============================================================
   UI PRIMITIVES
   ============================================================ */
function toast(msg, type = 'ok'){
  const wrap = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item toast-' + (type === 'err' ? 'err' : type === 'info' ? 'info' : 'ok');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function openModal(html){
  document.getElementById('modalContent').innerHTML =
    `<button class="modal-close" onclick="closeModal()">×</button>` + html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBg').classList.toggle('show');
}

function guard(fn){
  return function(...args){
    try {
      const r = fn.apply(this, args);
      if (r && typeof r.then === 'function') r.catch(e => { console.error(e); toast(e.message, 'err'); });
      return r;
    } catch (e){ console.error(e); toast(e.message, 'err'); }
  };
}

function go(route){
  window.location.hash = '#' + route;
  if (window.innerWidth < 1024){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBg').classList.remove('show');
  }
}

function parseRoute(){
  const h = (window.location.hash || '#dashboard').replace('#','');
  return { route: h.split('/')[0] || 'dashboard' };
}

function updateStats(){
  const r = document.getElementById('sideRecords');
  const fr = document.getElementById('footerRecords');
  const fs = document.getElementById('footerSize');
  const c = DB.count();
  if (r) r.textContent = c;
  if (fr) fr.textContent = c;
  if (fs) fs.textContent = DB.sizeKB() + ' KB';
}

/* ============================================================
   COMPONENTS
   ============================================================ */
function kpi(label, value, sub, color){
  return `<div class="card p-4">
    <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">${esc(label)}</div>
    <div class="kpi-value mt-1 ${color || 'text-[#0b3d36]'}">${value}</div>
    ${sub ? `<div class="text-xs text-slate-400 mt-0.5">${esc(sub)}</div>` : ''}
  </div>`;
}

function pill(status){
  const map = {
    ACTIVE:'bg-emerald-100 text-emerald-800', SUSPENDED:'bg-amber-100 text-amber-800',
    EXITED:'bg-slate-100 text-slate-600', PLANNING:'bg-sky-100 text-sky-800',
    PAUSED:'bg-amber-100 text-amber-800', CLOSED:'bg-slate-100 text-slate-600',
    REQUESTED:'bg-amber-100 text-amber-800', APPROVED:'bg-sky-100 text-sky-800',
    DISBURSED:'bg-indigo-100 text-indigo-800', REPAID:'bg-emerald-100 text-emerald-800',
    REJECTED:'bg-rose-100 text-rose-800', CANCELLED:'bg-slate-100 text-slate-600',
    DEFAULTED:'bg-rose-100 text-rose-800',
  };
  return `<span class="pill ${map[status] || 'bg-slate-100 text-slate-700'}">${esc(status)}</span>`;
}

function avatar(name, size = 'w-9 h-9'){
  const pal = ['#0f5248','#146b5d','#1a8874','#c9a227','#b08e1e','#0b3d36'];
  const c = pal[String(name||'X').charCodeAt(0) % pal.length];
  return `<div class="${size} rounded-full grid place-items-center text-white font-bold text-xs shrink-0" style="background:${c}">${esc(initials(name))}</div>`;
}

function header(title, subtitle, actions){
  return `<div class="mb-5 flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-extrabold text-[#062a26] gold-underline inline-block">${esc(title)}</h1>
      <p class="text-sm text-slate-500 mt-3">${esc(subtitle)}</p>
    </div>
    ${actions ? `<div class="flex gap-2 flex-wrap">${actions}</div>` : ''}
  </div>`;
}

function memberOpts(selected){
  return MemberService.list().filter(m => m.status === 'ACTIVE')
    .map(m => `<option value="${m.id}" ${selected===m.id?'selected':''}>${esc(m.name)}</option>`)
    .join('') || '<option value="">No active members</option>';
}

function emptyState(icon, title, message, actionLabel, actionFn){
  return `<div class="empty py-12">
    <div class="text-4xl mb-3">${icon}</div>
    <div class="text-base font-bold text-slate-700 mb-1">${esc(title)}</div>
    <div class="text-sm text-slate-400 mb-4 max-w-md mx-auto">${esc(message)}</div>
    ${actionLabel ? `<button class="btn btn-p" onclick="${actionFn}">${esc(actionLabel)}</button>` : ''}
  </div>`;
}

  );

  const rows = list.length ? list.map(m => {
    const sav = Ledger.balance(`SAV-${m.id}`);
    const loan = Ledger.balance(`LOAN-${m.id}`);
    const shr = Ledger.balance(`SHR-${m.id}`);
    return `<tr>
      <td>
        <div class="flex items-center gap-3">
          ${avatar(m.name, 'w-9 h-9')}
          <div>
            <div class="font-semibold text-slate-800">${esc(m.name)}</div>
            <div class="text-[11px] text-slate-400">${esc(m.memberNumber)} · ${CONFIG.roles[m.role] || m.role}</div>
          </div>
        </div>
      </td>
      <td class="text-slate-500 text-sm">${esc(m.phone || '—')}</td>
      <td class="text-sm text-slate-500">${esc(m.email || '—')}</td>
      <td class="text-right mono ${sav < 0 ? 'text-rose-700' : ''}">${money(sav)}</td>
      <td class="text-right mono text-[#c9a227]">${money(shr)}</td>
      <td class="text-right mono ${loan > 0 ? 'text-rose-700 font-semibold' : 'text-slate-400'}">${money(loan)}</td>
      <td>${pill(m.status)}</td>
      <td class="text-right">
        <div class="action-btns">
          <button class="btn btn-s btn-xs" onclick="openMemberForm('${m.id}')">Edit</button>
          <button class="btn btn-r btn-xs" onclick="handleDeleteMember('${m.id}')">Delete</button>

  }).join('') : '';

  const body = rows || `<tr><td colspan="8">${emptyState('◉', 'No members yet', 'Add your first member to start accepting savings, issuing loans, and managing contributions.',
    'Add first member', 'openMemberForm()')}</td></tr>`;

  return `
  ${header('Members', 'Create, view, edit, and remove members.',
    `<button class="btn btn-p" onclick="openMemberForm()">+ New member</button>`)}

  ${all.length > 0 ? `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${kpi('Total Members', all.length)}
    ${kpi('Active', all.filter(m => m.status === 'ACTIVE').length, '', 'text-emerald-700')}
    ${kpi('Suspended', all.filter(m => m.status === 'SUSPENDED').length, '', 'text-amber-700')}
    ${kpi('Total Savings', money(Ledger.totalByPrefix('SAV-')))}

  <div class="card p-5">

      <div class="search-box w-full sm:w-64">
        <input class="inp" placeholder="Search name, phone, or ID…" value="${esc(window._memberSearch || '')}"

    <div class="overflow-x-auto">

        <thead><tr>
          <th>Member</th><th>Phone</th><th>Email</th>

      </table>

  </div>`;
};

function openMemberForm(id){
  const m = id ? state.members.find(x => x.id === id) : null;
  const isEdit = !!m;

  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">${isEdit ? 'Edit member' : 'New member'}</h2>
    <p class="text-xs text-slate-500 mb-4">${isEdit ? 'Update member details' : 'Add a new member to the group'}</p>
    <form onsubmit="event.preventDefault(); submitMemberForm(this, ${isEdit ? `'${id}'` : 'null'});">
      <label class="text-xs font-semibold text-slate-600">Full name *</label>
      <input name="name" class="inp mb-3" value="${esc(m?.name || '')}" required>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Phone</label>
          <input name="phone" class="inp" value="${esc(m?.phone || '')}" placeholder="+251911...">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Email</label>
          <input name="email" type="email" class="inp" value="${esc(m?.email || '')}">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="text-xs font-semibold text-slate-600">Role</label>
          <select name="role" class="inp">
            ${Object.entries(CONFIG.roles).map(([k, v]) =>
              `<option value="${k}" ${(m?.role || 'MEMBER') === k ? 'selected' : ''}>${v}</option>`
            ).join('')}
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Status</label>
          <select name="status" class="inp">
            ${CONFIG.statuses.member.map(s =>
              `<option value="${s}" ${(m?.status || 'ACTIVE') === s ? 'selected' : ''}>${s}</option>`
            ).join('')}
          </select>
        </div>
      </div>

      <div class="flex gap-2 justify-end">
        <button type="button" class="btn btn-s" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-p">${isEdit ? 'Save changes' : '+ Add member'}</button>
      </div>
    </form>
  `);
}

function submitMemberForm(form, id){
  guard(() => {
    const data = {
      name: form.name.value, phone: form.phone.value,
      email: form.email.value, role: form.role.value, status: form.status.value,
    };
    if (id) {
      MemberService.update(id, data);
      toast('Member updated');
    } else {
      const m = MemberService.create(data);
      toast('Member created: ' + m.name);
    }
    DB.save();
    closeModal();
    safeRender();
  })();
}

function handleDeleteMember(id){
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  const sav = Ledger.balance(`SAV-${id}`);
  const loan = Ledger.balance(`LOAN-${id}`);
  const shr = Ledger.balance(`SHR-${id}`);
  const hasBalances = Math.abs(sav) > 0.01 || Math.abs(loan) > 0.01 || Math.abs(shr) > 0.01;
  const hasActiveLoan = state.loans.some(l => l.membershipId === id && l.status === 'DISBURSED');

  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Delete member</h2>
    <p class="text-sm text-slate-600 mb-3">Remove <strong>${esc(m.name)}</strong>?</p>

    ${hasActiveLoan
      ? `<div class="bg-rose-50 border border-rose-200 rounded-lg p-3 mb-3 text-xs text-rose-800">
          ⚠ Active loan. Repay or write it off first.
        </div>` : ''}

    ${hasBalances && !hasActiveLoan ? `
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3 text-xs text-amber-800">
        <div class="font-semibold mb-2">Current balances:</div>
        <div class="space-y-0.5 font-mono">
          <div>Savings: ${money(sav)}</div>
          <div>Loan:    ${money(loan)}</div>
          <div>Shares:  ${money(shr)}</div>
        </div>
      </div>` : ''}

    <p class="text-xs text-slate-500 mb-4">
      <strong>Suspend</strong> keeps records and marks inactive.<br>
      <strong>Force delete</strong> posts clearing entries, then removes the member.
    </p>

    <div class="flex flex-wrap gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="handleSuspendMember('${id}')">Suspend</button>
      ${!hasActiveLoan
        ? `<button class="btn btn-r" onclick="confirmForceDeleteMember('${id}')">Force delete</button>` : ''}
    </div>
  `);
}

function handleSuspendMember(id){
  guard(() => {
    MemberService.update(id, { status: 'SUSPENDED' });
    DB.save();
    closeModal();
    toast('Member suspended');
    safeRender();
  })();
}

function confirmForceDeleteMember(id){
  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Confirm force delete</h2>
    <p class="text-sm text-slate-600 mb-3">
      Posts clearing entries to zero out <strong>${esc(mName(id))}</strong>'s balances, then removes the member.
    </p>
    <p class="text-xs text-slate-500 mb-4">Reversing entries stay in the ledger and audit log.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-r" onclick="forceDeleteMember('${id}')">Yes, force delete</button>
    </div>
  `);
}

function forceDeleteMember(id){
  guard(() => {
    MemberService.forceRemove(id);
    DB.save();
    closeModal();
    toast('Member deleted and balances cleared');
    safeRender();
  })();
}

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">

    ${kpi('Active', all.filter(u => u.status === 'ACTIVE').length, '', 'text-emerald-700')}

function openUnitForm(id){

function submitUnitForm(form, id){
  guard(() => {
    const data = {
      name: form.name.value, description: form.description.value,
      managerId: form.managerId.value || null,
      category: form.category.value,
      initialCapital: form.initialCapital.value,
      status: form.status.value,
    };
    if (id) {
      UnitService.update(id, data);
      toast('Unit updated');
    } else {
      const u = UnitService.create(data);
      toast('Unit created: ' + u.name);
    }
    DB.save();
    closeModal();
    safeRender();
  })();
}

function handleDeleteUnit(id){
  const u = state.units.find(x => x.id === id);
  if (!u) return;
  const cap = Ledger.balance(`UNIT-${id}`);
  const hasCapital = Math.abs(cap) > 0.01;

  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Delete business unit</h2>
    <p class="text-sm text-slate-600 mb-3">Remove <strong>${esc(u.name)}</strong>?</p>

    ${hasCapital ? `
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3 text-xs text-amber-800">
        <div class="font-semibold mb-1">Unit holds ${money(cap)} in capital.</div>
        <div>Choose how to clear it before deletion:</div>
      </div>` : ''}

    <p class="text-xs text-slate-500 mb-4">
      ${hasCapital
        ? '<strong>Return to cash</strong> moves capital back to cash. <strong>Write-off</strong> moves it to equity.'
        : 'This unit has no capital and can be deleted safely.'}
    </p>

    <div class="flex flex-wrap gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      ${!hasCapital
        ? `<button class="btn btn-r" onclick="confirmDeleteUnit('${id}')">Yes, delete</button>`
        : `<button class="btn btn-r" onclick="confirmUnitWriteoff('${id}')">Write-off to equity</button>
           <button class="btn btn-p" onclick="confirmUnitReturn('${id}')">Return to cash</button>`}
    </div>
  `);
}

function confirmDeleteUnit(id){
  guard(() => {
    UnitService.remove(id);
    DB.save();
    closeModal();
    toast('Unit deleted');
    safeRender();
  })();
}

function confirmUnitReturn(id){
  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">Return capital to cash</h2>
    <p class="text-sm text-slate-600 mb-4">Moves all unit capital back to Cash &amp; Bank, then deletes the unit.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="doUnitReturn('${id}')">Return &amp; delete</button>
    </div>
  `);
}

function doUnitReturn(id){
  guard(() => {
    UnitService.forceRemove(id);
    DB.save();
    closeModal();
    toast('Capital returned and unit deleted');
    safeRender();
  })();
}

function confirmUnitWriteoff(id){
  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Write-off unit capital</h2>
    <p class="text-sm text-slate-600 mb-4">Moves all unit capital to group equity, then deletes the unit.</p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-r" onclick="doUnitWriteoff('${id}')">Write-off &amp; delete</button>
    </div>
  `);
}

function doUnitWriteoff(id){
  guard(() => {
    UnitService.writeOff(id);
    DB.save();
    closeModal();
    toast('Unit written off and deleted');
    safeRender();
  })();
}

/* ----- SAVINGS ----- */
views.savings = () => {
  const memberCount = MemberService.list().length;
  if (memberCount === 0) {
    return `
    ${header('Savings', 'Record member deposits and withdrawals.')}
    <div class="card p-5">${emptyState('◐', 'No members to save yet',
      'You need at least one member before you can record savings.',
      'Add first member', 'openMemberForm()')}</div>`;
  }

  const balances = MemberService.list()
    .map(m => ({ id: m.id, name: m.name, balance: Ledger.balance(`SAV-${m.id}`) }))
    .sort((a, b) => b.balance - a.balance);

  const balanceRows = balances.map(b => `
    <tr>
      <td><div class="flex items-center gap-2">${avatar(b.name, 'w-7 h-7')}<span class="text-sm">${esc(b.name)}</span></div></td>
      <td class="text-right mono font-semibold ${b.balance < 0 ? 'text-rose-700' : ''}">${money(b.balance)}</td>
    </tr>`).join('');

  const txs = state.journalEntries.slice().reverse()
    .filter(e => e.type === 'SAVINGS_DEPOSIT' || e.type === 'SAVINGS_WITHDRAWAL')
    .slice(0, 20);

  const txRows = txs.length ? txs.map(e => `
    <tr>
      <td class="text-slate-400 text-xs whitespace-nowrap">${dtShort(e.date)}</td>
      <td class="text-sm">${esc(mName(e.metadata?.memberId))}</td>
      <td>${e.type === 'SAVINGS_DEPOSIT'
        ? '<span class="pill bg-emerald-100 text-emerald-800">Deposit</span>'
        : '<span class="pill bg-rose-100 text-rose-800">Withdraw</span>'}</td>
      <td class="text-right mono font-semibold">${money(e.metadata?.amount || 0)}</td>
      <td class="text-right">
        ${e.reversedAt
          ? '<span class="text-xs text-slate-400">reversed</span>'
          : `<button class="btn btn-r btn-xs" onclick="handleReverseEntry('${e.id}')">Reverse</button>`}
      </td>
    </tr>`).join('') : `<tr><td colspan="5" class="empty">No savings activity yet — click <b>+ Deposit</b> to start.</td></tr>`;

  return `
  ${header('Savings', 'Deposits and withdrawals. Each posts a balanced journal entry.',
    `<button class="btn btn-g" onclick="openSavingsForm('deposit')">+ Deposit</button>
     <button class="btn btn-r" onclick="openSavingsForm('withdraw')">↑ Withdraw</button>`)}

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${kpi('Total Savings', money(Ledger.totalByPrefix('SAV-')))}
    ${kpi('Cash Position', money(Ledger.balance('1000')))}
    ${kpi('Transactions', state.journalEntries.filter(e => e.type.startsWith('SAVINGS_')).length)}
    ${kpi('Members', memberCount)}
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card p-5">
      <h2 class="font-bold text-slate-800 mb-3">Member balances</h2>
      <div class="max-h-96 overflow-y-auto">
        <table><tbody>${balanceRows}</tbody></table>
      </div>
    </div>

    <div class="card p-5 lg:col-span-2">
      <h2 class="font-bold text-slate-800 mb-3">Recent transactions</h2>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Date</th><th>Member</th><th>Type</th><th class="text-right">Amount</th><th></th></tr></thead>
          <tbody>${txRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
};

function openSavingsForm(mode){
  if (MemberService.list().filter(m => m.status === 'ACTIVE').length === 0) {
    toast('Add at least one active member first', 'err');
    openMemberForm();
    return;
  }
  const isDeposit = mode === 'deposit';
  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">${isDeposit ? 'Record deposit' : 'Record withdrawal'}</h2>
    <form onsubmit="event.preventDefault(); submitSavingsForm(this, '${mode}');">
      <label class="text-xs font-semibold text-slate-600">Member *</label>
      <select name="member" class="inp mb-3" required>${memberOpts()}</select>
      <label class="text-xs font-semibold text-slate-600">Amount *</label>
      <input name="amount" type="number" step="0.01" min="0.01" class="inp mb-3" required>
      ${isDeposit ? `
        <label class="text-xs font-semibold text-slate-600">Note</label>
        <input name="note" class="inp mb-4" placeholder="Optional">
      ` : ''}
      <div class="flex gap-2 justify-end">
        <button type="button" class="btn btn-s" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn ${isDeposit ? 'btn-g' : 'btn-r'}">${isDeposit ? 'Deposit' : 'Withdraw'}</button>
      </div>
    </form>
  `);
}

function submitSavingsForm(form, mode){
  guard(() => {
    if (mode === 'deposit') {
      SavingsService.deposit(form.member.value, form.amount.value, form.note?.value || '');
      toast('Deposit recorded');
    } else {
      SavingsService.withdraw(form.member.value, form.amount.value);
      toast('Withdrawal recorded');
    }
    DB.save();
    closeModal();
    safeRender();
  })();
}

function handleReverseEntry(entryId){
  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Reverse transaction</h2>

    <form onsubmit="event.preventDefault(); submitReverseEntry(this, '${entryId}');">

      <div class="flex gap-2 justify-end">

        <button type="submit" class="btn btn-r">Reverse entry</button>
      </div>
    </form>
  `);
}

function submitReverseEntry(form, entryId){
  guard(() => {
    SavingsService.reverse(entryId, form.reason.value);
    DB.save();
    closeModal();
    toast('Transaction reversed');
    safeRender();
  })();
}

/* ----- LOANS ----- */
views.loans = () => {
  const list = LoanService.list();
  const rows = list.length ? list.map(ln => {
    const out = ln.status === 'DISBURSED' ? ln.outstandingPrincipal + ln.outstandingInterest : 0;
    let action = '';
    if (ln.status === 'REQUESTED') {
      action = `<div class="action-btns">
        <button class="btn btn-g btn-xs" onclick="handleLoanApprove('${ln.id}')">Approve</button>
        <button class="btn btn-r btn-xs" onclick="handleLoanReject('${ln.id}')">Reject</button>
      </div>`;
    } else if (ln.status === 'APPROVED') {
      action = `<button class="btn btn-p btn-xs" onclick="handleLoanDisburse('${ln.id}')">Disburse</button>`;
    } else if (ln.status === 'DISBURSED') {
      action = `<div class="action-btns">
        <button class="btn btn-g btn-xs" onclick="openLoanRepay('${ln.id}')">Repay</button>
        <button class="btn btn-r btn-xs" onclick="handleLoanWriteOff('${ln.id}')">Write-off</button>
      </div>`;
    } else {
      action = `<span class="text-xs text-slate-400">—</span>`;
    }
    return `<tr>
      <td>
        <div class="flex items-center gap-2">${avatar(mName(ln.membershipId), 'w-8 h-8')}
          <div>
            <div class="text-sm font-semibold">${esc(mName(ln.membershipId))}</div>
            <div class="text-[11px] text-slate-400">${esc(ln.loanNumber)}</div>
          </div>
        </div>
      </td>
      <td class="text-right mono">${money(ln.principal)}</td>
      <td class="text-right text-sm">${ln.interestRate}%</td>
      <td class="text-right text-sm">${ln.termMonths}mo</td>
      <td class="text-right mono text-sm">${money(ln.monthlyPayment)}</td>
      <td class="text-right mono ${out > 0 ? 'text-rose-700 font-semibold' : 'text-slate-400'}">${out > 0 ? money(out) : '—'}</td>
      <td>${pill(ln.status)}</td>
      <td class="text-right">${action}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8">${emptyState('◑', 'No loans yet', 'Submit the first loan request. Members can borrow up to 3× their savings.',
    'New loan request', 'openLoanForm()')}</td></tr>`;

  return `
  ${header('Loans', 'Request → approve → disburse → repay. Write-offs post to equity.',
    `<button class="btn btn-p" onclick="openLoanForm()">+ New loan request</button>`)}

  ${list.length > 0 ? `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${kpi('Total Loans', list.length)}
    ${kpi('Disbursed', list.filter(l => l.status === 'DISBURSED').length, '', 'text-indigo-700')}
    ${kpi('Outstanding', money(Ledger.totalByPrefix('LOAN-')))}
    ${kpi('Interest Earned', money(Ledger.balance('4000')), '', 'text-emerald-700')}
  </div>` : ''}

  <div class="card p-5">
    <h2 class="font-bold text-slate-800 mb-3">Loan book</h2>
    <div class="overflow-x-auto">
      <table>
        <thead><tr>
          <th>Member</th><th class="text-right">Principal</th><th class="text-right">Rate</th>
          <th class="text-right">Term</th><th class="text-right">Monthly</th>
          <th class="text-right">Outstanding</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
};

function openLoanForm(){
  if (MemberService.list().filter(m => m.status === 'ACTIVE').length === 0) {
    toast('Add at least one active member first', 'err');
    openMemberForm();
    return;
  }
  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">New loan request</h2>
    <p class="text-xs text-slate-500 mb-4">Max: savings × ${CONFIG.rules.maxLoanMultiplier}. Min savings: ${money(CONFIG.rules.minSavingsForLoan)}.</p>
    <form onsubmit="event.preventDefault(); submitLoanForm(this);">
      <label class="text-xs font-semibold text-slate-600">Member *</label>
      <select name="member" class="inp mb-3" required>${memberOpts()}</select>
      <label class="text-xs font-semibold text-slate-600">Principal *</label>
      <input name="principal" type="number" step="0.01" min="0.01" class="inp mb-3" required>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="text-xs font-semibold text-slate-600">Interest %</label>
          <input name="rate" type="number" step="0.1" class="inp" value="${CONFIG.rules.defaultInterestRate}">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Term (months)</label>
          <input name="term" type="number" min="1" class="inp" value="${CONFIG.rules.defaultTermMonths}">

    </form>

function submitLoanForm(form){
  guard(() => {
    LoanService.request(form.member.value, form.principal.value, form.rate.value, form.term.value, form.purpose.value);
    DB.save();
    closeModal();
    toast('Loan requested');
    safeRender();
  })();
}

function handleLoanApprove(id){ guard(() => { LoanService.approve(id); DB.save(); toast('Approved'); safeRender(); })(); }
function handleLoanReject(id){ guard(() => { LoanService.reject(id, ''); DB.save(); toast('Rejected'); safeRender(); })(); }
function handleLoanDisburse(id){ guard(() => { LoanService.disburse(id); DB.save(); toast('Disbursed'); safeRender(); })(); }

function handleLoanWriteOff(id){

  const out = round(ln.outstandingPrincipal + ln.outstandingInterest);
  openModal(`
    <h2 class="text-lg font-bold text-rose-700 mb-1">Write off loan</h2>
    <p class="text-sm text-slate-600 mb-4">
      Mark <strong>${esc(mName(ln.membershipId))}</strong>'s loan of ${money(out)} as bad debt.

    <p class="text-xs text-slate-500 mb-4">
      Posts <strong>Debit Group Equity, Credit Loan Receivable</strong> for ${money(out)}.
    </p>
    <div class="flex gap-2 justify-end">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-r" onclick="doLoanWriteOff('${id}')">Write off</button>
    </div>
  `);
}

function doLoanWriteOff(id){
  guard(() => {
    LoanService.writeOff(id);
    DB.save();
    closeModal();
    toast('Loan written off');
    safeRender();
  })();
}

function openLoanRepay(id){
  const ln = state.loans.find(l => l.id === id);
  openModal(`
    <h2 class="text-lg font-bold text-slate-800 mb-1">Loan repayment</h2>
    <p class="text-xs text-slate-500 mb-4">

function submitLoanRepay(form, id){
  guard(() => {
    LoanService.repay(id, form.amount.value);

    closeModal();
    toast('Repayment recorded');
    safeRender();

}

function openCampaignClear(id, mode){
  const c = state.campaigns.find(x => x.id === id);
  const raised = Ledger.balance(`CAMP-${id}`);

  if (mode === 'transfer') {
    const others = CampaignService.list().filter(x => x.id !== id && x.status === 'ACTIVE');
    if (others.length === 0) { toast('No other active campaigns', 'err'); return; }
    openModal(`
      <h2 class="text-lg font-bold text-slate-800 mb-1">Transfer funds</h2>
      <p class="text-sm text-slate-600 mb-4">Move ${money(raised)} from <strong>${esc(c.name)}</strong> to another campaign.</p>
      <form onsubmit="event.preventDefault(); submitCampaignTransfer(this, '${id}');">
        <label class="text-xs font-semibold text-slate-600">Destination campaign *</label>
        <select name="target" class="inp mb-3" required>
          ${others.map(o => `<option value="${o.id}">${esc(o.name)} (${money(Ledger.balance(`CAMP-${o.id}`))})</option>`).join('')}
        </select>
        <label class="text-xs font-semibold text-slate-600">Amount</label>
        <input name="amount" type="number" step="0.01" min="0.01" max="${raised}" class="inp mb-4" value="${raised.toFixed(2)}" required>
        <div class="flex gap-2 justify-end">
          <button type="button" class="btn btn-s" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-p">Transfer</button>
        </div>
      </form>
    `);
  } else if (mode === 'refund') {
    const contribs = CampaignService.contributors(id);
    const total = Object.values(contribs).reduce((s, v) => s + v, 0);
    if (total < 0.01) { toast('No contributions to refund', 'err'); return; }
    const rows = Object.entries(contribs).map(([mid, amt]) => `
      <tr>
        <td class="text-sm">${esc(mName(mid))}</td>
        <td class="text-right mono text-sm">${money(amt)}</td>
        <td class="text-right mono text-sm text-emerald-700">${money(round((amt / total) * raised))}</td>
      </tr>`).join('');

    openModal(`
      <h2 class="text-lg font-bold text-slate-800 mb-1">Refund contributors</h2>
      <p class="text-sm text-slate-600 mb-3">Refund ${money(raised)} proportionally. Funds go back to member savings.</p>
      <div class="bg-slate-50 rounded-lg p-3 mb-4 max-h-64 overflow-y-auto">
        <table>
          <thead><tr><th>Member</th><th class="text-right">Contributed</th><th class="text-right">Refund</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="flex gap-2 justify-end">
        <button class="btn btn-s" onclick="closeModal()">Cancel</button>
        <button class="btn btn-gold" onclick="doCampaignRefund('${id}')">Refund all</button>
      </div>
    `);
  } else if (mode === 'writeoff') {
    openModal(`
      <h2 class="text-lg font-bold text-slate-800 mb-1">Write-off to equity</h2>
      <p class="text-sm text-slate-600 mb-4">Move ${money(raised)} from <strong>${esc(c.name)}</strong> to group equity, then delete.</p>
      <div class="flex gap-2 justify-end">
        <button class="btn btn-s" onclick="closeModal()">Cancel</button>
        <button class="btn btn-r" onclick="doCampaignWriteoff('${id}')">Write-off &amp; delete</button>
      </div>
    `);
  }
}

function submitCampaignTransfer(form, id){
  guard(() => {
    const targetId = form.target.value;
    const amount = round(num(form.amount.value));
    const c = state.campaigns.find(x => x.id === id);
    const t = state.campaigns.find(x => x.id === targetId);
    if (!c || !t) throw new Error('Campaign not found');
    const raised = Ledger.balance(`CAMP-${id}`);
    if (amount <= 0) throw new Error('Amount must be greater than zero');
    if (amount > raised + 0.01) throw new Error(`Cannot transfer more than ${money(raised)}`);

    Ledger.post({
      description: `Fund transfer · ${c.name} → ${t.name}`,
      type: 'ADJUSTMENT',
      reference: id,
      lines: [
        { accountCode: `CAMP-${id}`, debit: amount },
        { accountCode: `CAMP-${targetId}`, credit: amount },
      ],
      metadata: { fromCampaignId: id, toCampaignId: targetId, amount },
    });
    c.raisedAmount = round(num(c.raisedAmount) - amount);
    t.raisedAmount = round(num(t.raisedAmount) + amount);
    audit('campaign.transfer', 'Campaign', id, null, { toCampaignId: targetId, amount });

    DB.save();
    closeModal();
    toast(`Transferred ${money(amount)} to ${t.name}`);
    safeRender();
  })();
}

function doCampaignRefund(id){
  guard(() => {
    const c = state.campaigns.find(x => x.id === id);
    const raised = Ledger.balance(`CAMP-${id}`);
    const contribs = CampaignService.contributors(id);
    const totalContrib = Object.values(contribs).reduce((s, v) => s + v, 0);
    if (totalContrib < 0.01) throw new Error('Nothing to refund');

    let refunded = 0;
    for (const [mid, amt] of Object.entries(contribs)) {
      const portion = round((amt / totalContrib) * raised);
      if (portion < 0.01) continue;
      Ledger.post({
        description: `Campaign refund · ${c.name} → ${mName(mid)}`,
        type: 'ADJUSTMENT',
        reference: id,
        lines: [
          { accountCode: `CAMP-${id}`, debit: portion },
          { accountCode: `SAV-${mid}`, credit: portion },
        ],
        metadata: { campaignId: id, memberId: mid, amount: portion },
      });
      refunded = round(refunded + portion);
    }
    c.raisedAmount = 0;
    audit('campaign.refund', 'Campaign', id, null, { total: refunded, recipients: Object.keys(contribs).length });

    DB.save();
    closeModal();
    toast(`Refunded ${money(refunded)} to ${Object.keys(contribs).length} contributors`);
    safeRender();
  })();
}

function doCampaignWriteoff(id){
  guard(() => {
    const c = state.campaigns.find(x => x.id === id);
    const raised = Ledger.balance(`CAMP-${id}`);
    if (raised > 0.01) {
      Ledger.post({
        description: `Campaign write-off · ${c.name}`,
        type: 'ADJUSTMENT',
        reference: id,
        lines: [
          { accountCode: `CAMP-${id}`, debit: raised },
          { accountCode: '3100', credit: raised },
        ],
        metadata: { campaignId: id, amount: raised, reason: 'write_off' },
      });
    }
    c.raisedAmount = 0;
    audit('campaign.writeoff', 'Campaign', id, null, { amount: raised });

    CampaignService.remove(id);
    DB.save();
    closeModal();
    toast('Campaign written off and deleted');
    safeRender();
  })();
}

views.ledger = () => {
  const verify = Ledger.verify();
  const accounts = state.accounts.slice().sort((a, b) => a.code.localeCompare(b.code));
  const hasEntries = state.journalEntries.length > 0;

  const acctRows = accounts.map(a => {
    let label = a.name;
    if (a.membershipId) label += ' · ' + mName(a.membershipId);
    return `<tr>
      <td class="text-xs mono text-slate-400">${esc(a.code)}</td>

      <td class="text-xs text-slate-400 capitalize">${esc(a.type)}</td>
      <td class="text-right mono font-semibold ${num(a.balance) < 0 ? 'text-rose-700' : ''}">${money(a.balance)}</td>
    </tr>`;
  }).join('');

  const recent = state.journalEntries.slice(-40).reverse();
  const entries = recent.length ? recent.map(e => {
    const lines = state.journalLines.filter(l => l.journalEntryId === e.id).map(l => {
      const acc = state.accounts.find(a => a.id === l.accountId);
      let label = acc ? acc.name : '?';
      if (acc?.membershipId) label += ' · ' + mName(acc.membershipId);
      return `<tr class="bg-[#f9fbfb]">

        <td class="text-right mono text-xs">${num(l.debit) ? money(l.debit) : ''}</td>
        <td class="text-right mono text-xs">${num(l.credit) ? money(l.credit) : ''}</td>
      </tr>`;
    }).join('');
    return `<tr class="bg-white">
      <td colspan="3" class="pt-4 pb-1">
        <div class="flex justify-between items-baseline flex-wrap gap-2">
          <span class="font-semibold text-sm text-slate-800">${esc(e.description)}</span>
          <span class="text-[11px] text-slate-400 mono">${dtLong(e.date)}</span>
        </div>
      </td>
    </tr>${lines}`;
  }).join('') : `<tr><td class="empty">No entries yet. Your journal will populate as you use the platform.</td></tr>`;

  return `
  ${header('General Ledger', 'Every transaction is a balanced double-entry. Debits equal credits.')}

  <div class="card p-4 mb-4 ${verify.balanced ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full ${verify.balanced ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
        <div>
          <div class="font-semibold text-sm ${verify.balanced ? 'text-emerald-800' : 'text-rose-800'}">
            ${verify.balanced ? '✓ Balanced' : '⚠ Out of balance'}
          </div>
          <div class="text-xs text-slate-500">Dr ${money(verify.debit)} = Cr ${money(verify.credit)}</div>
        </div>
      </div>
      ${hasEntries ? `<button class="btn btn-s btn-xs" onclick="handleRebuild()">Rebuild balances</button>` : ''}
    </div>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card p-5">
      <h2 class="font-bold text-slate-800 mb-3">Chart of accounts (${accounts.length})</h2>
      <div class="max-h-[600px] overflow-y-auto">
        <table>
          <thead><tr><th>Code</th><th>Account</th><th>Type</th><th class="text-right">Balance</th></tr></thead>
          <tbody>${acctRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card p-5 lg:col-span-2">
      <h2 class="font-bold text-slate-800 mb-3">Journal</h2>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Account</th><th class="text-right">Debit</th><th class="text-right">Credit</th></tr></thead>
          <tbody>${entries}</tbody>
        </table>
      </div>
    </div>
  </div>`;
};

    toast('Balances rebuilt from journal');
